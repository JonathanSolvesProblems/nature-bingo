<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nature Bingo</title>
<meta name="description" content="A printable bingo card of what is most likely out this October near your town. Print it, leave the phone at home, go find it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f6f1e4;
    --ink: #22261c;
    --muted: #6b6a58;
    --line: #2f3a24;
    --leaf: #b5531c;
    --moss: #4f6a2c;
    --card: #fffdf6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b1d16; --ink: #ece6d3; --muted: #a9a58e; --line: #c9c2a6;
      --leaf: #e08a4f; --moss: #9dbb6a; --card: #24271d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.5 Inter, system-ui, sans-serif;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 20px; }
  .controls p { margin: 0; flex: 1 1 320px; color: var(--muted); }
  select, button {
    font: inherit; padding: 9px 14px; border-radius: 8px; border: 1.5px solid var(--line);
    background: var(--card); color: var(--ink);
  }
  button { background: var(--moss); color: #fff; border-color: var(--moss); font-weight: 600; cursor: pointer; }

  .sheet { background: var(--card); border: 2px solid var(--line); border-radius: 6px; padding: 22px 22px 16px; }
  header.top { display: flex; justify-content: space-between; align-items: end; gap: 16px; border-bottom: 2px solid var(--line); padding-bottom: 10px; }
  h1 { font: 700 40px/1 Fraunces, Georgia, serif; margin: 0; letter-spacing: -0.5px; }
  h1 span { color: var(--leaf); }
  .where { text-align: right; font: 500 18px/1.2 Fraunces, Georgia, serif; }
  .where small { display: block; font: 12px Inter, sans-serif; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); border: 1.5px solid var(--line); margin-top: 14px; }
  .sq { --img-h: 170px; position: relative; border: 1px solid var(--line); display: flex; flex-direction: column; }
  .sq img { width: 100%; height: var(--img-h); flex: none; object-fit: cover; filter: saturate(0.9); display: block; }
  .sq .noimg { height: var(--img-h); flex: none; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .sq .label { flex: 1 1 auto; padding: 5px 7px 6px; background: var(--card); border-top: 1px solid var(--line); }
  .sq .common { font: 600 13px/1.15 Inter, sans-serif; }
  .sq .sci { font: italic 11px/1.2 Inter, sans-serif; color: var(--muted); }
  .sq .tick { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border: 2px solid var(--line); border-radius: 50%; background: var(--card); display: grid; place-items: center; font: 700 14px/1 Inter, sans-serif; color: #fff; }
  .sq { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
  .sq.found img { filter: saturate(0.9) brightness(0.55); }
  .sq.found .tick { width: 34px; height: 34px; background: var(--leaf); border-color: var(--leaf); font-size: 20px; }
  .sq.found .label { background: color-mix(in srgb, var(--leaf) 16%, var(--card)); }
  .sq .when { font-size: 10.5px; color: var(--leaf); font-weight: 600; }
  .tally { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; font: 600 16px/1.2 Inter, sans-serif; }
  .tally button { background: transparent; color: var(--muted); border-color: var(--muted); font-size: 13px; padding: 6px 10px; }

  footer.notes { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; margin-top: 12px; font-size: 11.5px; color: var(--muted); }
  footer.notes strong { color: var(--ink); }
  .credits { font-size: 8.5px; line-height: 1.3; color: var(--muted); margin-top: 10px; }

  .refusal { margin-top: 14px; padding: 18px; border: 2px dashed var(--line); border-radius: 6px; }

  @media (max-width: 640px) {
    h1 { font-size: 30px; }
    .grid { grid-template-columns: repeat(2, 1fr); }
    footer.notes { grid-template-columns: 1fr; }
  }
  @page { size: letter; margin: 0.4in; }
  @media print {
    :root { --paper: #fff; --card: #fff; --ink: #111; --muted: #444; --line: #222; }
    body { background: #fff; }
    .controls, .tally { display: none; }
    .sq.found img { filter: none; }
    .sq.found .label { background: #fff; }
    .sq .when { display: none; }
    .wrap { padding: 0; max-width: none; }
    .sheet { border: none; padding: 0; }
    .grid { grid-template-columns: repeat(4, 1fr); margin-top: 10px; }
    .sq { --img-h: 1.45in; break-inside: avoid; }
    .sq .common { font-size: 11.5px; }
    .sq .sci { font-size: 9.5px; }
    h1 { font-size: 34px; }
    footer.notes { font-size: 10px; margin-top: 8px; }
    .credits { font-size: 7px; margin-top: 6px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <select id="town" aria-label="Town"></select>
    <button onclick="window.print()">Print the card</button>
    <p>Print it and leave the phone at home, or take it along and tap a square when you find it.</p>
  </div>
  <div class="sheet" id="sheet"></div>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

// Finds are kept only in this browser: { taxon_id: ISO time it was tapped }.
const storeKey = (name, card) => `nature-bingo:${name}:${card.year}`;
function loadFound(key) {
  try { return JSON.parse(localStorage.getItem(key)) || {}; } catch { return {}; }
}
function saveFound(key, found) {
  try { localStorage.setItem(key, JSON.stringify(found)); } catch { /* private mode: marks last until the page closes */ }
}
const clock = iso => new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

function paintMarks(name, card, found) {
  document.querySelectorAll(".sq").forEach(el => {
    const t = found[el.dataset.id];
    el.classList.toggle("found", !!t);
    el.setAttribute("aria-pressed", t ? "true" : "false");
    el.querySelector(".tick").textContent = t ? "✓" : "";
    el.querySelector(".when").textContent = t ? `found ${clock(t)}` : "";
  });
  const n = Object.keys(found).length;
  document.getElementById("count").textContent = `Found ${n} of ${card.squares.length}`;
}

function render(name, card) {
  const sheet = document.getElementById("sheet");
  const squares = card.squares.map(s => `
    <div class="sq" role="button" tabindex="0" aria-pressed="false" data-id="${s.taxon_id}">
      ${s.photo ? `<img src="${esc(s.photo)}" alt="${esc(s.common || s.name)}">` : `<div class="noimg">no open photo</div>`}
      <span class="tick" aria-hidden="true"></span>
      <div class="label"><div class="common">${esc(cap(s.common) || s.name)}</div><div class="sci">${esc(s.name)}</div><div class="when"></div></div>
    </div>`).join("");
  const logged = card.backtest_2025_logged;
  const credits = card.squares.filter(s => s.photo_credit).map(s => `${esc(cap(s.common) || s.name)}: ${esc(s.photo_credit)}`).join(" · ");
  sheet.innerHTML = `
    <header class="top">
      <h1>Nature <span>Bingo</span></h1>
      <div class="where">${esc(name)}<small>October ${card.year} · within about 10 km</small></div>
    </header>
    <div class="tally"><span id="count"></span><button type="button" id="clear">Clear marks</button></div>
    <div class="grid">${squares}</div>
    <footer class="notes">
      <div><strong>How this card was made.</strong> A tabular model (TabPFN, open weights, run on a laptop) ranked what
      iNaturalist users have photographed near here and across the region in past Octobers. These are the 16 things it
      thinks you are most likely to find this month.</div>
      <div><strong>What it cannot know.</strong> It only knows what people photographed and logged. Shy, small and
      night-time things are under-counted.${logged != null ? ` When I ran the same method on last October, people photographed ${logged} of the 16 things on this town's card. The other ${16 - logged} went unphotographed, which is not the same as absent.` : ""}</div>
    </footer>
    <div class="credits">Photos from iNaturalist under their own open licences. ${credits}</div>`;

  const key = storeKey(name, card);
  let found = loadFound(key);
  const toggle = el => {
    const id = el.dataset.id;
    if (found[id]) delete found[id]; else found[id] = new Date().toISOString();
    saveFound(key, found);
    paintMarks(name, card, found);
  };
  sheet.querySelectorAll(".sq").forEach(el => {
    el.addEventListener("click", () => toggle(el));
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(el); } });
  });
  document.getElementById("clear").onclick = () => {
    if (!Object.keys(found).length || confirm("Clear every mark on this card?")) {
      found = {}; saveFound(key, found); paintMarks(name, card, found);
    }
  };
  paintMarks(name, card, found);
}

fetch("cards.json").then(r => r.json()).then(cards => {
  const sel = document.getElementById("town");
  const names = Object.keys(cards).sort();
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join("");
  const want = new URLSearchParams(location.search).get("town");
  sel.value = names.includes(want) ? want : (names.includes("Hawkesbury") ? "Hawkesbury" : names[0]);
  const go = () => { render(sel.value, cards[sel.value]); history.replaceState(null, "", `?town=${encodeURIComponent(sel.value)}`); };
  sel.onchange = go;
  go();
});
</script>
</body>
</html>
